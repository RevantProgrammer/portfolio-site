<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>contact — guest@portfolio</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">

<div class="terminal">

  <div class="titlebar">
    <div class="dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
    <div class="titlebar-name">guest@portfolio: ~/contact</div>
  </div>

  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-link" data-page="home" href="index.html">~/home</a>
      <a class="nav-link" data-page="about" href="about.html">~/about</a>
      <a class="nav-link" data-page="projects" href="projects.html">~/projects</a>
      <a class="nav-link" data-page="blogs" href="blogs.html">~/blogs</a>
      <a class="nav-link" data-page="research" href="research.html">~/research</a>
      <a class="nav-link" data-page="contact" href="contact.html">~/contact</a>
    </div>
  </nav>

  <div class="screen">

    <section class="block">
      <p class="prompt">guest@portfolio <span class="path">~/contact</span> % <span class="cmd">cat contact.txt</span></p>
      <div class="output">
        <ul class="contact-list">
          <li><span class="key">email</span> <a href="mailto:you@example.com">you@example.com</a></li>
          <li><span class="key">github</span> <a href="https://github.com/yourhandle" target="_blank" rel="noopener">github.com/yourhandle</a></li>
          <li><span class="key">linkedin</span> <a href="https://linkedin.com/in/yourhandle" target="_blank" rel="noopener">linkedin.com/in/yourhandle</a></li>
        </ul>
      </div>
    </section>

    <p class="prompt end-prompt">guest@portfolio <span class="path">~/contact</span> % <span class="cursor">&nbsp;</span></p>

  </div>
</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
